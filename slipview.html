<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slip View Details</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Pyidaungsu', 'Myanmar Text', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
            line-height: 1.6;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .active-time-section {
            background: #2c3e50;
            color: white;
            padding: 15px 20px;
            text-align: center;
            border-bottom: 3px solid #3498db;
        }

        .active-time {
            font-size: 20px;
            font-weight: bold;
            color: #2ecc71;
            padding: 8px 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            display: inline-block;
            margin-top: 5px;
        }

        .search-section {
            background: #f8f9fa;
            padding: 20px;
            border-bottom: 2px solid #e9ecef;
        }

        .search-title {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .search-input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-family: 'Pyidaungsu', sans-serif;
            font-size: 16px;
            text-align: center;
        }

        .search-input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
        }

        .clear-btn {
            background: #95a5a6;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0 20px;
            cursor: pointer;
            font-family: 'Pyidaungsu', sans-serif;
            font-weight: bold;
            transition: background 0.3s;
        }

        .clear-btn:hover {
            background: #7f8c8d;
        }

        .search-status {
            color: #7f8c8d;
            font-size: 14px;
            text-align: center;
            padding: 5px;
            min-height: 20px;
        }

        .data-section {
            padding: 20px;
            max-height: 500px;
            overflow-y: auto;
        }

        .slip-item {
            background: white;
            margin-bottom: 15px;
            border-radius: 10px;
            border: 2px solid #e9ecef;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .slip-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .slip-header {
            background: #f8f9fa;
            padding: 15px;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .slip-number {
            background: #3498db;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }

        .user-name {
            font-weight: bold;
            color: #2c3e50;
            font-size: 16px;
            flex: 1;
            margin-left: 15px;
        }

        .slip-total {
            color: #e74c3c;
            font-weight: bold;
            font-size: 16px;
        }

        .bet-items {
            padding: 15px;
        }

        .bet-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px dotted #eee;
            font-size: 15px;
        }

        .bet-row:last-child {
            border-bottom: none;
        }

        .bet-number {
            color: #2c3e50;
            font-weight: bold;
            min-width: 40px;
        }

        .bet-amount {
            color: #27ae60;
            font-weight: bold;
        }

        .item-total {
            text-align: right;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #ddd;
            font-weight: bold;
            color: #2c3e50;
            font-size: 16px;
        }

        .grand-total-section {
            background: #2c3e50;
            color: white;
            padding: 15px 20px;
            text-align: center;
            border-top: 3px solid #3498db;
        }

        .grand-total-label {
            font-size: 16px;
            margin-bottom: 5px;
        }

        .grand-total-amount {
            font-size: 28px;
            font-weight: bold;
            color: #2ecc71;
        }

        .empty-message {
            text-align: center;
            color: #7f8c8d;
            padding: 40px 20px;
            font-style: italic;
            background: #f8f9fa;
            border-radius: 8px;
            margin: 10px 0;
        }

        .loading-container {
            text-align: center;
            padding: 40px 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #7f8c8d;
        }

        .error-message {
            color: #e74c3c;
            text-align: center;
            padding: 10px;
            background: #ffeaea;
            border-radius: 5px;
            margin: 10px 0;
        }

        .no-results {
            color: #7f8c8d;
            text-align: center;
            padding: 20px;
            font-style: italic;
            background: #f8f9fa;
            border-radius: 8px;
        }

        @media (max-width: 480px) {
            .container {
                border-radius: 10px;
            }
            
            .active-time {
                font-size: 18px;
            }
            
            .search-box {
                flex-direction: column;
            }
            
            .clear-btn {
                padding: 12px;
            }
            
            .bet-row {
                font-size: 14px;
            }
            
            .grand-total-amount {
                font-size: 24px;
            }
        }
    </style>
    
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <!-- Active Time Section -->
        <div class="active-time-section">
            <div class="search-title">Active Time</div>
            <div class="active-time" id="activeTimeDisplay">Loading...</div>
        </div>
        
        <!-- Search Section -->
        <div class="search-section">
            <div class="search-title">Search by Number (00-99)</div>
            <div class="search-box">
                <input type="number" 
                       class="search-input" 
                       id="searchInput" 
                       placeholder="Enter number..."
                       min="0" 
                       max="99" 
                       maxlength="2">
                <button class="clear-btn" id="clearBtn">Clear</button>
            </div>
            <div class="search-status" id="searchStatus">
                Enter number to filter results
            </div>
        </div>
        
        <!-- Data Section -->
        <div class="data-section" id="dataSection">
            <div class="loading-container" id="loadingContainer">
                <div class="spinner"></div>
                <div class="loading-text">လောင်းကြေးများ လာရောက်နေသည်...</div>
            </div>
        </div>
        
        <!-- Grand Total Section -->
        <div class="grand-total-section">
            <div class="grand-total-label">စုစုပေါင်း ငွေပမာဏ</div>
            <div class="grand-total-amount" id="grandTotal">0</div>
        </div>
    </div>

    <script src="su.js"></script>
       
  <script src="slipview.js"></script>
    <script src="slipview-helper.js"></script>
    <script src="check.js"></script>


   
</body>
</html>
